        const CHUNK_SIZE = 500000;
        const saveFileChunks = async (collectionName, taskId, fileId, base64Data, userId) => {
            const totalChunks = Math.ceil(base64Data.length / CHUNK_SIZE);
            const chunksColl = collection(db, collectionName, taskId, 'attachments', fileId, 'chunks');
            const promises = [];
            for (let i = 0; i < totalChunks; i++) {
                const chunk = base64Data.substring(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
                promises.push(
                    setDoc(doc(chunksColl, `chunk_${i}`), {
                        index: i,
                        data: chunk,
                        userId: userId || 'anonymous'
                    })
                );
            }
            await Promise.all(promises);
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [authError, setAuthError] = useState(null);
            const [activeTab, setActiveTab] = useState('team');
            const [tasks, setTasks] = useState([]);
            const [loadingData, setLoadingData] = useState(false);
            const [alertMessage, setAlertMessage] = useState(null);
            const [downloadingFileId, setDownloadingFileId] = useState(null);
            
            const [confirmModal, setConfirmModal] = useState({ isOpen: false, title: '', message: '', onConfirm: null });
            
            // Master Admin Access Management State
            const [showAdminModal, setShowAdminModal] = useState(false);
            const [adminUsersList, setAdminUsersList] = useState([]);
            const [newAdminEmail, setNewAdminEmail] = useState('');
            const [isSavingAdmin, setIsSavingAdmin] = useState(false);

            const [filterStatus, setFilterStatus] = useState('all');
            const [filterAssignee, setFilterAssignee] = useState('all');
            const [filterCreatedMonth, setFilterCreatedMonth] = useState('');
            const [filterCreatedDate, setFilterCreatedDate] = useState('');
            const [filterDueDate, setFilterDueDate] = useState('');
            
            const [newTaskTitle, setNewTaskTitle] = useState('');
            const [newTaskAssignee, setNewTaskAssignee] = useState('');
            const [newTaskDueDate, setNewTaskDueDate] = useState('');
            const [newTaskDueTime, setNewTaskDueTime] = useState('');
            const [newTaskFiles, setNewTaskFiles] = useState([]);
            
            const [expandedTaskId, setExpandedTaskId] = useState(null);
            const [commentText, setCommentText] = useState('');
            const [commentFiles, setCommentFiles] = useState([]);
            
            const [editingTaskId, setEditingTaskId] = useState(null);
            const [editTitle, setEditTitle] = useState('');
            const [editAssignee, setEditAssignee] = useState('');
            const [editDueDate, setEditDueDate] = useState('');
            const [editDueTime, setEditDueTime] = useState('');
            const [editTaskFiles, setEditTaskFiles] = useState([]);
            
            const [editingNoteIndex, setEditingNoteIndex] = useState(null);
            const [editNoteText, setEditNoteText] = useState('');
            const [readNotesMap, setReadNotesMap] = useState({});
            
            const [schedulingFollowUpId, setSchedulingFollowUpId] = useState(null);
            const [followUpDate, setFollowUpDate] = useState('');
            const [followUpTime, setFollowUpTime] = useState('');
            
            const [presenceUsers, setPresenceUsers] = useState([]);
            const [showPresenceModal, setShowPresenceModal] = useState(false);
            
            const prevTasksRef = useRef([]);
            const isInitialLoadRef = useRef(true);
            const isAdmin = user && ADMIN_EMAILS.includes((user.email || '').toLowerCase().trim());

            useEffect(() => {
                if (!auth) {
                    setAuthLoading(false);
                    return;
                }
                const fallbackTimer = setTimeout(() => {
                    setAuthLoading(false);

                const unsubscribe = onAuthStateChanged(auth, async (currentUser) => {
                    clearTimeout(fallbackTimer);
                    if (currentUser) {
                        const email = (currentUser.email || '').toLowerCase().trim();
                        let isAllowed = false;

                        if (email === 'saad.naiem@gmail.com') {
                            isAllowed = true; 
                        } else {
                            try {
                                const docRef = doc(db, 'allowed_users', email);
                                const docSnap = await getDoc(docRef);
                                if (docSnap.exists() && docSnap.data().active === true) {
                                    isAllowed = true;
                                } else if (!docSnap.exists() && ALLOWED_EMAILS.includes(email)) {
                                    isAllowed = true; // Graceful fallback
                                }
                            } catch (e) {
                                console.warn("Dynamic auth check failed, using fallback", e);
                                if (ALLOWED_EMAILS.includes(email)) isAllowed = true;
                            }
                        }

                        if (!isAllowed) {
                            await signOut(auth);
                            setUser(null);
                            setAuthError({
                                title: "Unauthorized to Log In",
                                email: currentUser.email || 'Unknown',
                                message: "Your account is not active or authorized to access this workspace."
                            });
                            setAuthLoading(false);
                            return;
                        }
                    }
                    setUser(currentUser);
                    setAuthLoading(false);
                });
                return () => {
                    clearTimeout(fallbackTimer);
                    unsubscribe();
                };
            }, []);

            useEffect(() => {
                if (!user || !db) return;
                const updatePresence = async (isOnline = true) => {
                    try {
                        const userPresenceRef = doc(db, 'user_presence', user.uid);
                        await setDoc(userPresenceRef, {
                            uid: user.uid,
                            email: (user.email || '').toLowerCase().trim(),
                            displayName: user.displayName || 'Team Member',
                            photoURL: user.photoURL || '',
                            online: isOnline,
                            lastActive: serverTimestamp(),
                            lastActiveIso: new Date().toISOString()
                        }, { merge: true });
                    } catch (err) {
                        console.warn("Presence ping notice:", err);
                    }
                };
                updatePresence(true);
                const intervalId = setInterval(() => {
                    if (document.visibilityState === 'visible') {
                        updatePresence(true);
                    }
                }, 45000);
                const handleVisibilityChange = () => {
                    if (document.visibilityState === 'visible') {
                        updatePresence(true);
                    }
                };
                const handleBeforeUnload = () => {
                    updatePresence(false);
                };
                document.addEventListener('visibilitychange', handleVisibilityChange);
                window.addEventListener('beforeunload', handleBeforeUnload);
                return () => {
                    clearInterval(intervalId);
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                    window.removeEventListener('beforeunload', handleBeforeUnload);
                    updatePresence(false);
                };
            }, [user]);

            useEffect(() => {
                if (!user || !isAdmin || !db) return;
                const unsubscribePresence = onSnapshot(collection(db, 'user_presence'), (snapshot) => {
                    const onlineList = [];
                    snapshot.forEach((docSnap) => {
                        onlineList.push({ id: docSnap.id, ...docSnap.data() });
                    });
                    
                    onlineList.sort((a, b) => {
                        const timeA = a.lastActive?.toMillis ? a.lastActive.toMillis() : new Date(a.lastActiveIso || 0).getTime();
                        const timeB = b.lastActive?.toMillis ? b.lastActive.toMillis() : new Date(b.lastActiveIso || 0).getTime();
                        return timeB - timeA;
                    });
                    setPresenceUsers(onlineList);
                }, (err) => {
                    console.warn("Presence read notice:", err);
                });
                return () => unsubscribePresence();
            }, [user, isAdmin]);

            const handleGoogleLogin = async () => {
                setAuthError(null);
                const provider = new GoogleAuthProvider();
                provider.setCustomParameters({ prompt: 'select_account' });
                try {
                    const result = await signInWithPopup(auth, provider);
                    const email = (result.user?.email || '').toLowerCase().trim();
                    
                    let isAllowed = false;
                    if (email === 'saad.naiem@gmail.com') {
                        isAllowed = true;
                    } else {
                        try {
                            const docRef = doc(db, 'allowed_users', email);
                            const docSnap = await getDoc(docRef);
                            if (docSnap.exists() && docSnap.data().active === true) {
                                isAllowed = true;
                            } else if (!docSnap.exists() && ALLOWED_EMAILS.includes(email)) {
                                isAllowed = true;
                            }
                        } catch (e) {
                            if (ALLOWED_EMAILS.includes(email)) isAllowed = true;
                        }
                    }

                    if (!isAllowed) {
                        const attemptEmail = result.user?.email || 'Unknown';
                        await signOut(auth);
                        setUser(null);
                        setAuthError({
                            title: "Unauthorized to Log In",
                            email: attemptEmail,
                            message: "Your account is not active or authorized to access this workspace."
                        });
                        return;
                    }
                } catch (err) {
                    console.error("Login Error:", err);
                    if (err.code === 'auth/unauthorized-domain') {
                        setAuthError({
                            title: "Domain Not Authorized",
                            message: `The domain '${window.location.hostname}' is not authorized. Add it in Firebase Console > Authentication > Settings > Authorized domains.`
                        });
                    } else if (err.code === 'auth/popup-blocked') {
                        try {
                            await signInWithRedirect(auth, provider);
                        } catch (redirectErr) {
                            setAuthError({
                                title: "Popup Blocked",
                                message: "Please allow popups for this site to complete the Google sign-in process."
                            });
                        }
                    } else if (err.code === 'auth/popup-closed-by-user') {
                        setAuthError({
                            title: "Popup Blocked or Closed",
                            message: "Please allow popups for this site to complete the Google sign-in process."
                        });
                    } else {
                        setAuthError({
                            title: "Authentication Error",
                            message: err.message
                        });
                    }
                }
            };

            const handleLogout = async () => {
                if (user && db) {
                    try {
                        await setDoc(doc(db, 'user_presence', user.uid), {
                            online: false,
                            lastActive: serverTimestamp(),
                            lastActiveIso: new Date().toISOString()

                if (auth) signOut(auth);
            };

            const openAdminModal = async () => {
                setShowAdminModal(true);
                try {
                    const snap = await getDocs(collection(db, 'allowed_users'));
                    let users = [];
                    snap.forEach(d => users.push({ id: d.id, ...d.data() }));

                            email: email,

            const handleAddAdminEmail = () => {
                const email = newAdminEmail.toLowerCase().trim();
                if (!email) return;
                if (adminUsersList.find(u => u.email === email)) {
                    setAlertMessage("⚠️ This email is already in the list.");

                    return;
                }
                setAdminUsersList([...adminUsersList, { 
                    id: email, 
                    email: email, 
                    active: true, 
                    addedAt: new Date().toISOString() 
                }]);
                setNewAdminEmail('');
            };

            const toggleAdminEmailActive = (email) => {
                if (email === 'saad.naiem@gmail.com') {
                    setAlertMessage("⚠️ The Master Admin account cannot be disabled.");
                    setTimeout(() => setAlertMessage(null), 3000);
                    return;
                }
                setAdminUsersList(adminUsersList.map(u => 
                    u.email === email ? { ...u, active: !u.active } : u

            const saveAdminChanges = async () => {
                setIsSavingAdmin(true);
                try {
                    for (const u of adminUsersList) {
                        await setDoc(doc(db, 'allowed_users', u.id), {
                            email: u.email,
                            active: u.active,
                            addedAt: u.addedAt || new Date().toISOString()

                    setAlertMessage("✅ Access settings saved to database successfully.");
                    setTimeout(() => setAlertMessage(null), 4000);
                    setShowAdminModal(false);
                } catch (e) {
                    setAlertMessage("❌ Error saving to database: " + e.message);
                    setTimeout(() => setAlertMessage(null), 6000);
                }
                setIsSavingAdmin(false);
            };

            useEffect(() => {
                if (!user || !db) return;
                
                setLoadingData(true);
                let q = activeTab === 'team' ? query(collection(db, 'team_todos')) : query(collection(db, 'private_todos'), where("userId", "==", user.uid));
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const tasksData = [];
                    snapshot.forEach((docSnap) => {
                        tasksData.push({ id: docSnap.id, ...docSnap.data() });
                    });
                    
                    tasksData.sort((a, b) => {
                       if (a.sortOrder !== undefined && b.sortOrder !== undefined) {
                           return a.sortOrder - b.sortOrder;
                       }
                       const timeA = a.createdAt?.toMillis() || 0;
                       const timeB = b.createdAt?.toMillis() || 0;
                       return timeB - timeA; 
                    });
                    
                    const prevTasks = prevTasksRef.current;
                    let totalNewNotesCount = 0;
                    if (!isInitialLoadRef.current && prevTasks.length > 0) {
                        tasksData.forEach(newTask => {
                            const oldTask = prevTasks.find(t => t.id === newTask.id);
                            if (oldTask && oldTask.comments && newTask.comments) {
                                if (newTask.comments.length > oldTask.comments.length) {
                                    const latestComment = newTask.comments[newTask.comments.length - 1];
                                    if (latestComment.author !== user.displayName) {
                                        totalNewNotesCount++;
                                    }
                                }
                            }
                        });
                    }
                    if (totalNewNotesCount > 0) {
                        setAlertMessage(`💬 You have ${totalNewNotesCount} new unread note(s) across tasks!`);
                        setTimeout(() => setAlertMessage(null), 6000);
                    }
                    isInitialLoadRef.current = false;
                    prevTasksRef.current = tasksData;
                    setTasks(tasksData);
                    setLoadingData(false);
                }, (err) => {
                    console.error("Firestore Error:", err);
                    setAuthError({
                        title: "Database Access Error",
                        message: "Cannot read database. Please verify your Firestore Rules."
                    });
                    setLoadingData(false);
                });
                return () => unsubscribe();
            }, [user, activeTab]);

            const convertFilesToBase64 = (fileList) => {
                return Promise.all(
                    Array.from(fileList).map(file => {
                        return new Promise((resolve) => {
                            if (file.type.startsWith('image/') && file.type !== 'image/svg+xml') {
                                const reader = new FileReader();
                                reader.onload = (e) => {
                                    const img = new Image();
                                    img.onload = () => {
                                        const MAX_DIM = 1600;
                                        let width = img.width;
                                        let height = img.height;
                                        if (width > height && width > MAX_DIM) {
                                            height = Math.round((height * MAX_DIM) / width);
                                            width = MAX_DIM;
                                        } else if (height > MAX_DIM) {
                                            width = Math.round((width * MAX_DIM) / height);
                                            height = MAX_DIM;
                                        }
                                        const canvas = document.createElement('canvas');
                                        canvas.width = width;
                                        canvas.height = height;
                                        const ctx = canvas.getContext('2d');
                                        ctx.drawImage(img, 0, 0, width, height);
                                        const compressedData = canvas.toDataURL('image/jpeg', 0.82);
                                        resolve({
                                            id: Date.now().toString() + Math.random().toString(36).substring(2, 6),
                                            name: file.name,
                                            size: Math.round((compressedData.length * 3) / 4),
                                            type: 'image/jpeg',
                                            data: compressedData
                                        });
                                    };
                                    img.onerror = () => {
                                        resolve({
                                            id: Date.now().toString() + Math.random().toString(36).substring(2, 6),
                                            name: file.name,
                                            size: file.size,
                                            type: file.type,
                                            data: e.target.result
                                        });
                                    };
                                    img.src = e.target.result;
                                };
                                reader.readAsDataURL(file);
                            } else {
                                const reader = new FileReader();
                                reader.onload = () => resolve({
                                    id: Date.now().toString() + Math.random().toString(36).substring(2, 6),
                                    name: String(file.name || 'file'),
                                    size: Number(file.size || 0),
                                    type: String(file.type || 'application/octet-stream'),
                                    data: String(reader.result || '')
                                });
                                reader.onerror = () => resolve(null);
                                reader.readAsDataURL(file);
                            }
                        });
                    })
                ).then(results => results.filter(Boolean));
            };

            const handleAddTask = async (e) => {
                e.preventDefault();
                if (!newTaskTitle.trim() || !user || !db) return;
                let dueDateTimeString = null;
                if (newTaskDueDate && newTaskDueTime) {
                    dueDateTimeString = new Date(`${newTaskDueDate}T${newTaskDueTime}`).toISOString();
                } else if (newTaskDueDate) {
                    dueDateTimeString = new Date(`${newTaskDueDate}T00:00`).toISOString();
                }
                const collectionName = activeTab === 'team' ? 'team_todos' : 'private_todos';
                const filesToUpload = [...newTaskFiles];
                const sanitizedMetadata = filesToUpload.map(f => ({
                    id: String(f.id),
                    name: String(f.name),
                    size: Number(f.size),
                    type: String(f.type)

                const taskPayload = {
                    title: newTaskTitle.trim(),
                    assignee: newTaskAssignee.trim() || user.displayName || 'Unassigned',
                    dueDateTime: dueDateTimeString,
                    status: 'pending',
                    comments: [],
                    followUps: [],

                    sortOrder: tasks.length > 0 ? Math.min(...tasks.map(t => t.sortOrder || 0)) - 10 : 0,
                    createdAt: serverTimestamp(),
                    userId: user.uid,
                    creatorEmail: user.email || '',
                    creatorName: user.displayName || 'Team Member'
                };
                setNewTaskTitle('');
                setNewTaskAssignee('');
                setNewTaskDueDate('');
                setNewTaskDueTime('');
                setNewTaskFiles([]);
                try {
                    const taskDocRef = await addDoc(collection(db, collectionName), taskPayload);
                    setAlertMessage("✅ Task created successfully!");

                    if (filesToUpload.length > 0) {
                        for (const file of filesToUpload) {

                    console.error("Error adding task:", err);
                    setAlertMessage("❌ Database error: " + err.message);
                    setTimeout(() => setAlertMessage(null), 5000);

            const handleUpdateTask = async (taskId) => {
                if (!editTitle.trim() || !db) return;
                const collectionName = activeTab === 'team' ? 'team_todos' : 'private_todos';
                
                let dueDateTimeString = null;
                if (editDueDate && editDueTime) {
                    dueDateTimeString = new Date(`${editDueDate}T${editDueTime}`).toISOString();
                } else if (editDueDate) {
                    dueDateTimeString = new Date(`${editDueDate}T00:00`).toISOString();
                }
                try {
                    const taskToUpdate = tasks.find(t => t.id === taskId);
                    let updatedAttachments = taskToUpdate.attachments || [];
                    const newFilesToUpload = [...editTaskFiles];
                    if (newFilesToUpload.length > 0) {
                        const sanitizedNewMeta = newFilesToUpload.map(f => ({
                            id: String(f.id),
                            name: String(f.name),
                            size: Number(f.size),
                            type: String(f.type)
                        }));
                        updatedAttachments = [...updatedAttachments, ...sanitizedNewMeta];
                    }
                    await updateDoc(doc(db, collectionName, taskId), {
                        title: editTitle.trim(),
                        assignee: editAssignee.trim() || 'Unassigned',
                        dueDateTime: dueDateTimeString,
                        attachments: updatedAttachments
                    });
                    setEditingTaskId(null);
                    setEditTaskFiles([]);
                    if (newFilesToUpload.length > 0) {
                        for (const file of newFilesToUpload) {
                            if (file.data) {
                                await saveFileChunks(collectionName, taskId, file.id, file.data, user.uid);
                            }
                        }
                    }
                } catch(err) { console.error("Error updating task:", err); }
            };

            const handleStartEditTask = (task) => {
                setEditingTaskId(task.id);
                setEditTitle(task.title);
                setEditAssignee(task.assignee || '');
                setEditTaskFiles([]);
                
                if (task.dueDateTime) {
                    try {
                        const d = new Date(task.dueDateTime);
                        const year = d.getFullYear();
                        const month = String(d.getMonth() + 1).padStart(2, '0');
                        const day = String(d.getDate()).padStart(2, '0');
                        setEditDueDate(`${year}-${month}-${day}`);
                        
                        const hours = String(d.getHours()).padStart(2, '0');
                        const mins = String(d.getMinutes()).padStart(2, '0');
                        setEditDueTime(`${hours}:${mins}`);
                    } catch(e) {
                        setEditDueDate('');
                        setEditDueTime('');
                    }
                } else {
                    setEditDueDate('');
                    setEditDueTime('');
                }
            };

            const handleDownloadAttachment = async (taskId, file) => {
                if (file.data && file.data.startsWith('data:')) {
                    triggerDownload(file.data, file.name);
                    return;
                }
                try {
                    setDownloadingFileId(file.id);
                    const collectionName = activeTab === 'team' ? 'team_todos' : 'private_todos';
                    const chunksColl = collection(db, collectionName, taskId, 'attachments', file.id, 'chunks');
                    const snap = await getDocs(chunksColl);
                    if (snap.empty) {
                        setAlertMessage("⚠️ File data is still uploading or unavailable.");
                        setTimeout(() => setAlertMessage(null), 3000);
                        setDownloadingFileId(null);
                        return;
                    }
                    const chunks = [];
                    snap.forEach(d => chunks.push(d.data()));
                    chunks.sort((a, b) => a.index - b.index);
                    const fullBase64 = chunks.map(c => c.data).join('');
                    triggerDownload(fullBase64, file.name);
                } catch (err) {
                    console.error("Download error:", err);
                    setAlertMessage("❌ Could not download file: " + err.message);
                    setTimeout(() => setAlertMessage(null), 4000);
                } finally {
                    setDownloadingFileId(null);
                }
            };

                link.href = dataUrl;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

                return (

                if (!isoString) return '';

            const getTimeAgo = (timestamp, isoString) => {
                let timeMillis = 0;
                if (timestamp && timestamp.toMillis) {
                    timeMillis = timestamp.toMillis();
                } else if (isoString) {
                    timeMillis = new Date(isoString).getTime();
                }
                if (!timeMillis) return 'Just now';
                const diffSeconds = Math.floor((Date.now() - timeMillis) / 1000);
                if (diffSeconds < 60) return `${diffSeconds}s ago`;
                const diffMinutes = Math.floor(diffSeconds / 60);
                if (diffMinutes < 60) return `${diffMinutes}m ago`;
                const diffHours = Math.floor(diffMinutes / 60);
                if (diffHours < 24) return `${diffHours}h ago`;
                return `${Math.floor(diffHours / 24)}d ago`;
            };

            const getRowStyle = (status) => {

                    default: return 'bg-white border-slate-200 text-slate-800';

            const filteredTasks = tasks.filter(task => {
                if (filterStatus !== 'all' && task.status !== filterStatus) return false;
                if (filterAssignee !== 'all' && task.assignee !== filterAssignee) return false;
                
                if (task.createdAt) {
                    const createdDateObj = new Date(task.createdAt.toMillis());
                    const year = createdDateObj.getFullYear();
                    const month = String(createdDateObj.getMonth() + 1).padStart(2, '0');
                    const day = String(createdDateObj.getDate()).padStart(2, '0');
                    if (filterCreatedMonth) {
                        const taskMonth = `${year}-${month}`;
                        if (taskMonth !== filterCreatedMonth) return false;

                    if (filterCreatedDate) {
                        const localDateStr = `${year}-${month}-${day}`;
                        if (localDateStr !== filterCreatedDate) return false;

                    return false;

                if (filterDueDate && task.dueDateTime) {

                    const y = dueObj.getFullYear();
                    const m = String(dueObj.getMonth() + 1).padStart(2, '0');
                    const d = String(dueObj.getDate()).padStart(2, '0');
                    const localDueStr = `${y}-${m}-${d}`;
                    if (localDueStr !== filterDueDate) return false;
                }
                return true;
            });

            const uniqueAssignees = [...new Set(tasks.map(t => t.assignee).filter(Boolean))];
            const isFilterActive = filterStatus !== 'all' || filterAssignee !== 'all' || filterCreatedMonth || filterCreatedDate || filterDueDate;

                                <span className="relative flex h-2 w-2 shrink-0">

                                                                        </div>
                                                                    ) : (
                                                                        <p className="text-slate-800 whitespace-pre-wrap break-words leading-relaxed">{comment.text}</p>
                                                                    )}
                                                                    {comment.attachments && comment.attachments.length > 0 && (
                                                                        <div className="flex flex-col sm:flex-row sm:flex-wrap gap-2 mt-3 pt-2 border-t border-slate-100 items-start sm:items-center">
                                                                            <span className="text-[11px] font-bold text-slate-700 shrink-0">Attachments ({comment.attachments.length}):</span>
                                                                            <div className="flex flex-wrap gap-2 w-full sm:w-auto">
                                                                                {comment.attachments.map((att, aIdx) => (
                                                                                    <div key={att.id || aIdx} className="flex items-center gap-1.5 text-[11px] bg-slate-50 text-blue-700 px-2.5 py-1.5 rounded-lg border shadow-sm max-w-full">
                                                                                            <button 
                                                                                            onClick={() => handleDownloadAttachment(task.id, att)} 
                                                                                            className="truncate max-w-[150px] font-bold text-blue-700 hover:underline cursor-pointer"
                                                                                            disabled={downloadingFileId === att.id}
                                                                                        >
                                                                                            {downloadingFileId === att.id ? '⏳' : '📎'} {att.name}
                                                                                        </button>
                                                                                        {comment.author === user.displayName && (
                                                                                            <button onClick={() => handleRemoveCommentAttachment(task.id, comment.id, att.id)} className="text-red-500 hover:text-red-700 font-black ml-1 cursor-pointer p-1 shrink-0" title="Remove file">
                                                                                                ×
                                                                                            </button>
                                                                                        )}
                                                                                    </div>
                                                                                ))}
                                                                            </div>
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        ))
                                                    )}
                                                </div>
                                                <div className="flex flex-col gap-3">
                                                    <div className="flex flex-col sm:flex-row gap-2.5">
                                                        <textarea
                                                            placeholder="Write a note..."
                                                            className="flex-grow w-full px-4 py-3 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-[#208838] bg-white min-h-[50px] resize-y"
                                                            value={commentText}
                                                            onChange={(e) => setCommentText(e.target.value)}
                                                            onKeyDown={(e) => {
                                                                if(e.key === 'Enter' && !e.shiftKey) {
                                                                    e.preventDefault();
                                                                    handleAddComment(task.id);
                                                                }
                                                            }}
                                                        ></textarea>
                                                        <button onClick={() => handleAddComment(task.id)} className="px-6 py-3 bg-slate-800 text-white text-sm font-black rounded-xl shadow-md hover:bg-slate-900 cursor-pointer w-full sm:w-auto shrink-0">
                                                            Post Note
                                                        </button>
                                                    </div>
                                                    <div className="flex items-center gap-3 bg-white p-2 rounded-lg border border-slate-200 w-full overflow-hidden">
                                                        <span className="text-xs font-bold text-slate-600 shrink-0">Attach files:</span>
                                                        <input 
                                                            type="file" 
                                                            multiple 
                                                            onChange={async (e) => {
                                                                if (e.target.files && e.target.files.length > 0) {
                                                                    const converted = await convertFilesToBase64(e.target.files);
                                                                    setCommentFiles(prev => [...prev, ...converted]);
                                                                    e.target.value = '';
                                                                }
                                                            }} 
                                                            className="text-xs text-slate-600 cursor-pointer file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-[11px] file:font-bold file:bg-slate-100 file:text-slate-700 w-full" 
                                                        />
                                                    </div>
                                                    {commentFiles.length > 0 && (
                                                        <div className="flex flex-wrap gap-2 items-center bg-slate-50 p-2.5 rounded-xl border text-xs">
                                                            <span className="font-bold text-slate-700 w-full sm:w-auto">Selected files ({commentFiles.length}):</span>
                                                            {commentFiles.map((file, fIdx) => (
                                                                <span key={file.id || fIdx} className="bg-white px-2.5 py-1 rounded-lg text-blue-700 border flex items-center gap-1.5 shadow-sm max-w-full">
                                                                    <span className="truncate">📄 {file.name}</span>
                                                                    <button type="button" onClick={() => {
                                                                        setCommentFiles(commentFiles.filter((_, idx) => idx !== fIdx));
                                                                    }} className="text-red-500 font-bold ml-1 cursor-pointer shrink-0">×</button>
                                                                </span>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        )}
                                    </li>
                                    )})}
                            </ul>
                        )}
                    </div>
                </div>
            );
        };

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, errorMsg: '' };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, errorMsg: error.message };
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div style={{padding:'20px', backgroundColor:'#fee2e2', color:'#991b1b', borderRadius:'12px', margin:'20px', fontFamily:'sans-serif', border:'2px solid #fca5a5'}}>
                            <h2 style={{fontWeight:'bold', fontSize:'18px'}}>⚠️ Application Error</h2>
                            <p style={{fontSize:'14px', marginTop:'8px'}}>The workspace encountered a rendering error. This usually happens if there is a network glitch with the CDN.</p>
                            <p style={{fontSize:'12px', fontFamily:'monospace', backgroundColor:'rgba(255,255,255,0.5)', padding:'8px', marginTop:'8px'}}>{this.state.errorMsg}</p>
                            <button onClick={() => window.location.reload()} style={{marginTop:'12px', padding:'8px 16px', backgroundColor:'#991b1b', color:'white', border:'none', borderRadius:'8px', cursor:'pointer', fontWeight:'bold'}}>Reload Workspace</button>
                        </div>
                    );
                }
                return this.props.children; 
            }
        }

        window.onerror = function(msg, url, lineNo, columnNo, error) {
            const preloader = document.getElementById('pre-loader');
            if (preloader) {
                preloader.innerHTML = `
                    <div style="background:#fee2e2; border:2px solid #fca5a5; border-radius:12px; padding:20px; color:#991b1b; text-align:left; max-width:500px; margin:0 auto; width:90%;">
                        <h3 style="margin-top:0; font-weight:bold;">⚠️ Script Load Error</h3>
                        <p style="font-size:14px; line-height:1.5;">The application script failed to load. This can happen if your browser is blocking third-party scripts or if there is a network firewall restriction.</p>
                        <p style="font-size:12px; font-family:monospace; margin-top:10px; background:rgba(255,255,255,0.7); padding:8px;">${msg}</p>
                        <button onclick="window.location.reload()" style="margin-top:15px; padding:8px 16px; background:#991b1b; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold;">Reload Page</button>
                    </div>
                `;
            }
            return false;
        };

        const rootElement = document.getElementById('root');
        if (rootElement) {
            const preloader = document.getElementById('pre-loader');
            if (preloader) preloader.style.display = 'none';
            
            const root = createRoot(rootElement);
            root.render(
                <ErrorBoundary>
                    <App />
                </ErrorBoundary>
            );
        }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch((error) => {
                    console.error('App installation support could not start:', error);
                });
            });
        }
    </script>
</body>
</html>
